name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config

      - name: Build
        run: cargo build --release --bin radio-server --target ${{ matrix.target }}

      - name: Build archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf radio-server-${{ matrix.target }}.tar.gz radio-server
          sha256sum radio-server-${{ matrix.target }}.tar.gz > radio-server-${{ matrix.target }}.tar.gz.sha256

      - name: Build archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path radio-server.exe -DestinationPath radio-server-${{ matrix.target }}.zip
          certutil -hashfile radio-server-${{ matrix.target }}.zip SHA256 > radio-server-${{ matrix.target }}.zip.sha256

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/radio-server-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/radio-server-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/radio-server-${{ matrix.target }}.zip
            target/${{ matrix.target }}/release/radio-server-${{ matrix.target }}.zip.sha256
