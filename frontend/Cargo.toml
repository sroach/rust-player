[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { path = "../shared" }
dioxus = { workspace = true }
dioxus-web = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
url = "2"
web-sys = { version = "0.3", features = ["HtmlMediaElement", "AudioContext", "AnalyserNode", "MediaElementAudioSourceNode", "AudioNode", "AudioDestinationNode", "CanvasRenderingContext2d", "ImageData", "HtmlCanvasElement"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
